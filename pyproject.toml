[project]
name = "chromolite"
version = "0.1.1"
description = "Python package to visualize local chroma db"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Surjendu Pal", email = "palsurjendu104@gmail.com" }
]
keywords = ["chromadb", "vector-database", "observability"]
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.140.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
chromolite = "chromolite.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chromolite"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/"]
